[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1f2430"
font = "sans serif"

[server]
# Necessário para rodar dentro do container/EasyPanel atrás do proxy reverso (Traefik)
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[ui]
hideTopBar = false
hideSidebarNav = false
